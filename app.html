<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiraiStitch — Store admin & storefront</title>
<meta name="description" content="MiraiStitch store — merchant admin and customer storefront demo (ZAR, VAT, local payments and couriers).">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c1917'/%3E%3Cpath d='M7 20 L13 11 L16 16 L19 11 L25 20' fill='none' stroke='%23d9a94e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' stroke-dasharray='3 2.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
  /* Committed light design, modeled on the Shopify admin: gray canvas, white cards, green brand. */
  :root{
    color-scheme: light;
    --canvas:#f1f2f4; --surface:#ffffff; --surface-2:#fafbfb;
    --ink:#1a1c1d; --muted:#616161; --muted-2:#8a8a8a;
    --line:#e3e3e3; --line-2:#ebebeb;
    --brand:#008060; --brand-dark:#004c3f; --brand-tint:#f0f7f4;
    --blue:#2c6ecb; --amber:#ffd79d; --amber-ink:#5c4810;
    --green-pill:#aee9d1; --green-pill-ink:#0b4b36;
    --gray-pill:#e3e3e3; --gray-pill-ink:#4a4a4a;
    --shadow:0 1px 2px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);
    --shadow-lg:0 8px 28px -8px rgba(0,0,0,.25);
    --r:12px; --r-sm:8px;
    --f: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--f);background:var(--canvas);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}
  img{max-width:100%}
  .hidden{display:none!important}

  /* buttons */
  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:var(--r-sm);font-weight:600;font-size:13px;box-shadow:var(--shadow);transition:background .15s,border-color .15s,transform .05s}
  .btn:hover{background:var(--surface-2)}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--brand);border-color:var(--brand-dark);color:#fff;box-shadow:0 1px 0 var(--brand-dark)}
  .btn-primary:hover{background:#00735a}
  .btn-sm{padding:5px 10px;font-size:12px}
  .btn svg{width:15px;height:15px}
  .btn-ghost{border-color:transparent;background:transparent;box-shadow:none}
  .btn-ghost:hover{background:#e9eaec}
  .btn-danger{color:#b42318}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--gray-pill);color:var(--gray-pill-ink)}
  .pill.paid{background:var(--green-pill);color:var(--green-pill-ink)}
  .pill.pending{background:var(--amber);color:var(--amber-ink)}
  .pill.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}

  /* ===== ADMIN SHELL ===== */
  .admin{display:flex;flex-direction:column;height:100vh}
  .topbar{height:56px;background:var(--brand-dark);display:flex;align-items:center;gap:14px;padding:0 16px;color:#eafff6;flex:none}
  .topbar .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;color:#fff;letter-spacing:-.01em}
  .topbar .logo .mk{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#5ee6b0,#008060);display:grid;place-items:center;color:#013;font-weight:800;font-size:15px}
  .searchbar{flex:1;max-width:520px;margin:0 auto;position:relative}
  .searchbar input{width:100%;height:34px;border-radius:8px;border:1px solid #1f6b58;background:#0a5a49;color:#eafff6;padding:0 12px 0 34px;outline:none}
  .searchbar input::placeholder{color:#8fcdb9}
  .searchbar svg{position:absolute;left:10px;top:9px;width:16px;height:16px;color:#8fcdb9}
  .topbar-right{display:flex;align-items:center;gap:10px}
  .avatar{width:30px;height:30px;border-radius:50%;background:#5c6ac4;color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
  .icon-btn{width:34px;height:34px;border-radius:8px;border:none;background:transparent;color:#cfeee2;display:grid;place-items:center}
  .icon-btn:hover{background:#0a5a49}
  .icon-btn svg{width:18px;height:18px}

  .admin-body{flex:1;display:flex;min-height:0}
  .sidebar{width:232px;background:var(--canvas);border-right:1px solid var(--line);padding:12px 12px;flex:none;overflow-y:auto}
  .nav-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:#303030;font-weight:500;font-size:13px;margin-bottom:2px;border:none;background:transparent;width:100%;text-align:left}
  .nav-item:hover{background:#e4e5e7}
  .nav-item.active{background:#dfe1e3;font-weight:600;color:#1a1c1d}
  .nav-item svg{width:18px;height:18px;color:#5a5a5a;flex:none}
  .nav-item.active svg{color:var(--brand-dark)}
  .nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#8a8a8a;font-weight:600;padding:14px 10px 6px}
  .main{flex:1;overflow-y:auto;padding:24px}
  .main-inner{max-width:900px;margin:0 auto}
  .page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .page-head h1{font-size:20px;font-weight:700;margin:0}
  .page-sub{color:var(--muted);font-size:13px;margin-top:2px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .card-pad{padding:18px}
  .card-head{padding:14px 18px;border-bottom:1px solid var(--line-2);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:space-between}

  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
  .metric .lab{font-size:12px;color:var(--muted);font-weight:600}
  .metric .val{font-size:22px;font-weight:800;margin-top:6px;letter-spacing:-.02em}
  .metric .chg{font-size:11px;color:var(--brand);font-weight:600;margin-top:3px}

  table.tbl{width:100%;border-collapse:collapse}
  table.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:600;padding:10px 18px;border-bottom:1px solid var(--line-2)}
  table.tbl td{padding:12px 18px;border-bottom:1px solid var(--line-2);font-size:13px;vertical-align:middle}
  table.tbl tr:last-child td{border-bottom:none}
  table.tbl tbody tr{cursor:pointer}
  table.tbl tbody tr:hover{background:var(--surface-2)}
  .prod-cell{display:flex;align-items:center;gap:11px}
  .thumb{width:38px;height:38px;border-radius:8px;background:var(--brand-tint);display:grid;place-items:center;font-size:20px;flex:none;border:1px solid var(--line-2)}
  .money{font-variant-numeric:tabular-nums}
  .right{text-align:right}

  .setup-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
  .setup-item:last-child{border-bottom:none}
  .setup-check{width:20px;height:20px;border-radius:50%;border:1.5px dashed #b5b5b5;flex:none;margin-top:1px;display:grid;place-items:center;background:transparent}
  .setup-item.done .setup-check{background:var(--brand);border-style:solid;border-color:var(--brand)}
  .setup-item.done .setup-check svg{width:12px;height:12px;color:#fff}
  .setup-item.done .st-title{text-decoration:line-through;color:var(--muted)}
  .st-title{font-weight:600;font-size:13px}
  .st-desc{color:var(--muted);font-size:12px;margin-top:2px}

  .empty{text-align:center;padding:48px 20px;color:var(--muted)}
  .empty .big{font-size:34px;margin-bottom:10px}
  .stub{padding:40px;text-align:center;color:var(--muted)}
  .stub .big{font-size:30px;margin-bottom:8px}

  /* form */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;color:#303030}
  .field input,.field select,.field textarea{width:100%;border:1px solid #b5b5b5;border-radius:8px;padding:8px 10px;outline:none;background:#fff}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-tint)}
  .field textarea{resize:vertical;min-height:70px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .hint{color:var(--muted-2);font-size:11px;font-weight:400}

  /* drawer / modal */
  .overlay{position:fixed;inset:0;background:rgba(26,28,29,.45);z-index:50;display:none;align-items:center;justify-content:center;padding:18px}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:14px;width:min(560px,100%);max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line-2)}
  .modal-head h3{margin:0;font-size:16px}
  .modal-body{padding:20px}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--line-2);display:flex;justify-content:flex-end;gap:10px}
  .x{width:32px;height:32px;border-radius:8px;border:none;background:transparent;color:var(--muted);display:grid;place-items:center}
  .x:hover{background:#eee}
  .x svg{width:18px;height:18px}

  /* ===== STOREFRONT ===== */
  .store{min-height:100vh;background:#fff;color:#111}
  .store-top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:14px 22px}
  .store-top .sname{font-weight:800;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
  .store-top .sname .mk{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#5ee6b0,#008060);display:grid;place-items:center;color:#013;font-weight:800}
  .store-top .right{display:flex;align-items:center;gap:8px}
  .cartbtn{position:relative;border:1px solid #e3e3e3;background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;display:flex;align-items:center;gap:7px}
  .cartbtn svg{width:17px;height:17px}
  .cartbtn .count{background:var(--brand);color:#fff;border-radius:999px;min-width:18px;height:18px;font-size:11px;display:grid;place-items:center;padding:0 5px}
  .store-hero{background:linear-gradient(120deg,#f0f7f4,#eef4ff);padding:46px 22px;text-align:center}
  .store-hero h1{font-size:clamp(26px,5vw,40px);margin:0 0 10px;letter-spacing:-.02em}
  .store-hero p{color:#555;max-width:52ch;margin:0 auto;font-size:15px}
  .store-hero .trust{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:18px;font-size:12px;color:#444;font-weight:600}
  .store-hero .trust span{background:#fff;border:1px solid #e6e6e6;padding:5px 12px;border-radius:999px}
  .store-wrap{max-width:1040px;margin:0 auto;padding:34px 22px}
  .store-wrap h2{font-size:20px;margin:0 0 18px}
  .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .pcard{border:1px solid #eee;border-radius:14px;overflow:hidden;background:#fff;transition:transform .18s,box-shadow .18s;cursor:pointer}
  .pcard:hover{transform:translateY(-4px);box-shadow:0 14px 30px -14px rgba(0,0,0,.2)}
  .pcard .pimg{aspect-ratio:1/1;background:var(--brand-tint);display:grid;place-items:center;font-size:66px}
  .pcard .pinfo{padding:14px}
  .pcard .pt{font-weight:600;font-size:14px}
  .pcard .pd{color:#777;font-size:12px;margin-top:2px;min-height:0}
  .pcard .pp{font-weight:800;margin-top:9px;font-variant-numeric:tabular-nums}
  .pcard .soldout{color:#b42318;font-size:12px;font-weight:600;margin-top:4px}

  /* cart drawer */
  .cart-drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:#fff;z-index:60;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s}
  .cart-drawer.open{transform:none}
  .cart-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid #eee}
  .cart-head h3{margin:0;font-size:17px}
  .cart-items{flex:1;overflow-y:auto;padding:12px 20px}
  .citem{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #f0f0f0}
  .citem .ci-img{width:56px;height:56px;border-radius:10px;background:var(--brand-tint);display:grid;place-items:center;font-size:28px;flex:none}
  .citem .ci-t{font-weight:600;font-size:13px}
  .citem .ci-p{color:#666;font-size:12px;margin-top:2px}
  .qty{display:inline-flex;align-items:center;border:1px solid #ddd;border-radius:8px;margin-top:8px}
  .qty button{width:26px;height:26px;border:none;background:#fff;font-size:15px;color:#333}
  .qty span{min-width:26px;text-align:center;font-size:13px;font-weight:600}
  .cart-foot{border-top:1px solid #eee;padding:18px 20px}
  .cart-line{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px;color:#444}
  .cart-total{display:flex;justify-content:space-between;font-size:17px;font-weight:800;margin:10px 0 14px}

  .checkout-wrap{max-width:760px;margin:0 auto;padding:30px 22px}
  .co-grid{display:grid;grid-template-columns:1.3fr .9fr;gap:24px}
  .pay-opt,.ship-opt{display:flex;align-items:center;gap:11px;border:1px solid #ddd;border-radius:10px;padding:12px 14px;margin-bottom:9px;cursor:pointer}
  .pay-opt.sel,.ship-opt.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-tint);background:var(--brand-tint)}
  .pay-opt .logo{font-weight:800;font-size:13px}
  .pay-opt .tag{margin-left:auto;font-size:11px;color:#777}
  .ship-opt .sh-price{margin-left:auto;font-weight:700}
  .co-summary{background:#fafbfb;border:1px solid #eee;border-radius:14px;padding:18px;height:fit-content;position:sticky;top:20px}
  .co-sum-item{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
  .co-sum-item .ci-img{width:40px;height:40px;border-radius:8px;background:var(--brand-tint);display:grid;place-items:center;font-size:20px;flex:none;position:relative}
  .co-sum-item .qbadge{position:absolute;top:-6px;right:-6px;background:#555;color:#fff;border-radius:999px;width:18px;height:18px;font-size:11px;display:grid;place-items:center}
  .consent{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:#555;margin:14px 0}
  .consent input{margin-top:2px}
  .pay-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:none;align-items:center;justify-content:center}
  .pay-overlay.open{display:flex}
  .pay-box{background:#fff;border-radius:16px;padding:34px 40px;text-align:center;max-width:360px}
  .pay-box .pf{font-weight:800;color:#e4572e;font-size:20px;margin-bottom:14px}
  .spinner{width:40px;height:40px;border:3px solid #eee;border-top-color:var(--brand);border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .confirm-box{max-width:560px;margin:40px auto;padding:0 22px;text-align:center}
  .confirm-box .tick{width:72px;height:72px;border-radius:50%;background:var(--brand);display:grid;place-items:center;margin:0 auto 18px}
  .confirm-box .tick svg{width:38px;height:38px;color:#fff}

  .banner{background:#1a1c1d;color:#fff;text-align:center;font-size:12px;padding:7px 14px}
  .banner b{color:#8fe3c4}
  .banner button{background:transparent;border:1px solid #555;color:#fff;border-radius:6px;padding:3px 9px;font-size:11px;margin-left:10px}

  @media(max-width:860px){
    .metrics{grid-template-columns:1fr 1fr}
    .pgrid{grid-template-columns:1fr 1fr}
    .co-grid{grid-template-columns:1fr}
    .sidebar{position:fixed;z-index:40;top:56px;bottom:0;left:0;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow-lg)}
    .sidebar.open{transform:none}
    .menu-toggle{display:grid!important}
  }
  @media(max-width:560px){
    .metrics{grid-template-columns:1fr 1fr}
    .pgrid{grid-template-columns:1fr 1fr}
    .searchbar{display:none}
    .hide-sm{display:none}
    .main{padding:16px}
  }
  .menu-toggle{display:none}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
<style>
/* MiraiStitch theme — porcelain + stone-ink + gold, Cormorant/Hanken */
:root{
  --canvas:#f7f5f2; --surface:#ffffff; --surface-2:#fbfaf8;
  --ink:#1c1917; --muted:#57534e; --muted-2:#a8a29e;
  --line:#e7e2db; --line-2:#efeae3;
  --brand:#a16207; --brand-dark:#7a4e0a; --brand-tint:#f3ead6;
  --blue:#7a4e0a;
  --f:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
}
body{background:var(--canvas)}
.topbar{background:var(--ink)}
.topbar .logo .mk{background:linear-gradient(135deg,#d9a94e,#a16207);color:#1c1917}
.searchbar input{background:#2a2521;border-color:#3a3531;color:#f3ead6}
.searchbar input::placeholder{color:#a8977f}
.searchbar svg{color:#a8977f}
.icon-btn{color:#e7dcc6}
.icon-btn:hover{background:#2a2521}
.btn-primary{background:var(--brand);border-color:var(--brand-dark);box-shadow:0 1px 0 var(--brand-dark);color:#fff}
.btn-primary:hover{background:var(--brand-dark)}
.avatar{background:#7a4e0a}
.nav-item.active svg{color:var(--brand-dark)}
.page-head h1,.store-top .sname,.confirm-box h1,.modal-head h3,.store-hero h1,.result-title{
  font-family:"Cormorant", Georgia, "Times New Roman", serif; font-weight:600; letter-spacing:-.01em;
}
.page-head h1{font-size:27px}
.store-hero{background:linear-gradient(120deg,#f3ead6,#f7f5f2)}
.store-hero h1{font-size:clamp(28px,5vw,46px)}
.store-top .sname .mk{background:linear-gradient(135deg,#d9a94e,#a16207);color:#1c1917}
.banner{background:var(--ink)}
.banner b{color:#d9a94e}
.pill.paid{background:#d8efe1;color:#0b4b36}
.pcard .pimg,.thumb,.ci-img,.co-sum-item .ci-img,.citem .ci-img{background:var(--brand-tint)}
a,button{font-family:var(--f)}
</style>
</head>
<body>

<div class="pay-overlay" id="payOverlay"><div class="pay-box"><div class="pf">PayFast</div><div class="spinner"></div><div style="font-weight:600">Redirecting to secure payment…</div><div style="color:#888;font-size:12px;margin-top:6px">Sandbox demo — no real charge</div></div></div>

<script>

      '<div class="field"><label>Delivery address</label><input name="addr" required placeholder="Street, suburb, city, postal code"></div></div>';
    h+='<div class="card card-pad" style="margin-bottom:16px"><div style="font-weight:700;margin-bottom:12px">Shipping method</div>';
    ships.forEach(function(s){h+='<label class="ship-opt'+(ship.name===s[0]?' sel':'')+'" data-action="pick-ship" data-name="'+s[0]+'" data-price="'+s[1]+'"><input type="radio" name="ship" '+(ship.name===s[0]?'checked':'')+'><div><div style="font-weight:600">'+s[0]+'</div><div class="hint">'+s[2]+'</div></div><div class="sh-price money">'+(s[1]?R(s[1]):"Free")+'</div></label>'});
    h+='</div>';
    h+='<div class="card card-pad"><div style="font-weight:700;margin-bottom:12px">Payment</div>';
    pays.forEach(function(p){h+='<label class="pay-opt'+(payMethod===p[0]?' sel':'')+'" data-action="pick-pay" data-name="'+p[0]+'"><input type="radio" name="pay" '+(payMethod===p[0]?'checked':'')+'><span class="logo">'+p[0]+'</span><span class="tag">'+p[1]+'</span></label>'});
    h+='</div></div>';
    // summary
    h+='<div class="co-summary"><div style="font-weight:700;margin-bottom:10px">Order summary</div>';
    cart.forEach(function(c){var p=prod(c.id);if(!p)return;h+='<div class="co-sum-item"><div class="ci-img">'+p.img+'<span class="qbadge">'+c.qty+'</span></div><div style="flex:1">'+esc(p.title)+'</div><div class="money">'+R(p.price*c.qty)+'</div></div>'});
    h+='<div style="margin-top:12px"><div class="cart-line"><span>Subtotal</span><span class="money">'+R(subtotal)+'</span></div>'+
      '<div class="cart-line"><span>Shipping</span><span class="money">'+(ship.price?R(ship.price):"Free")+'</span></div>'+
      '<div class="cart-line"><span>of which VAT (15%)</span><span class="money">'+R(vat)+'</span></div>'+
      '<div class="cart-total"><span>Total</span><span class="money">'+R(total)+'</span></div></div>';
    h+='<label class="consent"><input type="checkbox" name="popia" required> I agree to the processing of my personal information for this order (POPIA).</label>';
    h+='<button class="btn btn-primary" style="width:100%;justify-content:center" data-action="place-order" type="submit">Pay '+R(total)+' with '+payMethod+'</button>';
    h+='<div class="hint" style="text-align:center;margin-top:10px">🔒 Demo checkout — no real payment is taken.</div>';
    h+='</div></div></form></div>';
    return h;
  }
  function confirmPage(){
    var o=lastOrder; if(!o)return '<div class="confirm-box">Order placed.</div>';
    var h='<div class="confirm-box"><div class="tick">'+icon("check")+'</div><h1 style="font-size:24px;margin:0 0 6px">Thank you, '+esc(o.name.split(" ")[0])+'!</h1><p style="color:#555">Order '+o.num+' is confirmed. A receipt has been sent to '+esc(o.email)+'.</p>';
    h+='<div class="card card-pad" style="text-align:left;margin:22px 0">';
    o.items.forEach(function(i){h+='<div class="co-sum-item"><div class="ci-img">'+i.img+'<span class="qbadge">'+i.qty+'</span></div><div style="flex:1">'+esc(i.title)+'</div><div class="money">'+R(i.price*i.qty)+'</div></div>'});
    h+='<div class="cart-total" style="margin-top:12px"><span>Total paid</span><span class="money">'+R(orderTotal(o))+'</span></div>';
    h+='<div class="hint">'+esc(o.shipName)+' · Paid via '+esc(o.pay)+'</div></div>';
    h+='<div style="display:flex;gap:10px;justify-content:center"><button class="btn" data-action="back-to-store">Continue shopping</button><button class="btn btn-primary" data-action="view-admin">See it in admin →</button></div></div>';
    return h;
  }

  // ---- cart helpers ----
  function cartCount(){return cart.reduce(function(a,c){return a+c.qty},0)}
  function cartSub(){return cart.reduce(function(a,c){var p=prod(c.id);return a+(p?p.price*c.qty:0)},0)}

  // ================= EVENTS =================
  function wire(){
    // form submit (checkout)
    var co=document.getElementById("coform");
    if(co)co.addEventListener("submit",function(e){e.preventDefault();placeOrder(co)});
  }
  document.addEventListener("click",function(e){
    var t=e.target.closest("[data-action]");
    // close overlay when clicking backdrop (not inner modal)
    if(e.target.classList&&e.target.classList.contains("overlay")){closeAll();return}
    if(!t)return;
    var a=t.getAttribute("data-action"), id=t.getAttribute("data-id");
    if(a==="nav"){adminPage=t.getAttribute("data-page");sidebarOpen=false;render();window.scrollTo(0,0)}
    else if(a==="toggle-sidebar"){sidebarOpen=!sidebarOpen;render()}
    else if(a==="view-store"){location.href="store.html";return}
    else if(a==="view-admin"){mode="admin";adminPage="orders";cartOpen=false;render();window.scrollTo(0,0)}
    else if(a==="add-product"){editing={};render()}
    else if(a==="edit-product"){editing=prod(id);render()}
    else if(a==="save-product"){saveProduct()}
    else if(a==="delete-product"){S.products=S.products.filter(function(p){return p.id!==id});editing=null;save();render()}
    else if(a==="close-overlay"){closeAll()}
    else if(a==="open-order"){viewingOrder=S.orders.filter(function(o){return String(o.id)===String(id)})[0];render()}
    else if(a==="fulfill"){var o=S.orders.filter(function(x){return String(x.id)===String(id)})[0];if(o){o.fulfil="Fulfilled";S.setup.test=true;save()}viewingOrder=o;render()}
    else if(a==="toggle-setup"){var k=t.getAttribute("data-key");S.setup[k]=!S.setup[k];save();render()}
    else if(a==="view-product"){viewingProduct=prod(id);render()}
    else if(a==="add-to-cart"){addToCart(id);viewingProduct=null;cartOpen=true;render()}
    else if(a==="open-cart"){cartOpen=true;render()}
    else if(a==="close-cart"){cartOpen=false;render()}
    else if(a==="qty"){changeQty(id,parseInt(t.getAttribute("data-d"),10));render()}
    else if(a==="goto-checkout"){if(!cart.length)return;cartOpen=false;storePage="checkout";render();window.scrollTo(0,0)}
    else if(a==="back-to-store"){storePage="catalog";render();window.scrollTo(0,0)}
    else if(a==="pick-ship"){ship={name:t.getAttribute("data-name"),price:parseInt(t.getAttribute("data-price"),10)};render()}
    else if(a==="pick-pay"){payMethod=t.getAttribute("data-name");render()}
    else if(a==="place-order"){/* handled by form submit; fallback */}
  });

  function closeAll(){editing=null;viewingOrder=null;viewingProduct=null;cartOpen=false;render()}

  function saveProduct(){
    var f=document.getElementById("pform"); if(!f)return;
    if(!f.title.value.trim()||f.price.value===""||f.stock.value===""){f.reportValidity&&f.reportValidity();return}
    var data={title:f.title.value.trim(),desc:f.desc.value.trim(),price:Math.round(parseFloat(f.price.value)*100),stock:parseInt(f.stock.value,10),img:f.img.value,active:f.active.value==="1"};
    if(editing&&editing.id){Object.assign(prod(editing.id),data)}
    else{data.id="p"+Date.now();S.products.push(data);S.setup.product=true}
    editing=null;save();render();
  }
  function addToCart(id){var c=cart.filter(function(x){return x.id===id})[0];if(c)c.qty++;else cart.push({id:id,qty:1})}
  function changeQty(id,d){var c=cart.filter(function(x){return x.id===id})[0];if(!c)return;c.qty+=d;if(c.qty<=0)cart=cart.filter(function(x){return x.id!==id})}

  function placeOrder(form){
    if(!form.checkValidity()){form.reportValidity();return}
    if(!cart.length)return;
    var name=(form.fname.value+" "+form.lname.value).trim();
    var email=form.email.value.trim();
    // simulate PayFast redirect
    var ov=document.getElementById("payOverlay"); ov.classList.add("open");
    setTimeout(function(){
      ov.classList.remove("open");
      var items=cart.map(function(c){var p=prod(c.id);return {title:p.title,qty:c.qty,price:p.price,img:p.img}});
      // decrement stock
      cart.forEach(function(c){var p=prod(c.id);if(p)p.stock=Math.max(0,p.stock-c.qty)});
      var ord={id:S.nextOrder,num:"#"+S.nextOrder,name:name,email:email,date:Date.now(),status:"Paid",fulfil:"Unfulfilled",items:items,ship:ship.price,shipName:ship.name,pay:payMethod};
      S.nextOrder++; S.orders.unshift(ord); S.setup.test=true; lastOrder=ord; cart=[]; save();
      storePage="confirm"; render(); window.scrollTo(0,0);
    },1700);
  }

  render();
})();
</script>
</body>
</html>
