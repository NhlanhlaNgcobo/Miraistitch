<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiraiStitch — Live store</title>
<meta name="description" content="Live MiraiStitch storefront — renders the published builder layout with a working ZAR checkout.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c1917'/%3E%3Cpath d='M7 20 L13 11 L16 16 L19 11 L25 20' fill='none' stroke='%23d9a94e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' stroke-dasharray='3 2.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;0,700;1,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
<style>
  :root{
    --ink:#1c1917; --stone:#57534e; --muted:#8a827a;
    --gold:#a16207; --gold-deep:#7a4e0a; --gold-light:#d9a94e; --gold-tint:#f3ead6;
    --line:#e7e2db; --paper:#f7f5f2; --card:#fff;
    --r:14px;
    --f:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
    --serif:"Cormorant",Georgia,serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--f);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;line-height:1.6}
  img{max-width:100%}
  a{color:inherit;text-decoration:none}
  button{font-family:var(--f);cursor:pointer}
  .money{font-variant-numeric:tabular-nums}
  [hidden]{display:none!important}

  /* platform bar */
  .pbar{background:var(--ink);color:#e7dcc6;font-size:.8rem;display:flex;align-items:center;justify-content:center;gap:10px;padding:7px 14px;text-align:center}
  .pbar b{color:var(--gold-light)}
  .pbar a{color:#fff;border:1px solid #3a3531;border-radius:7px;padding:3px 10px;font-weight:600}
  .pbar a:hover{background:#2a2521}

  /* store header */
  .shead{position:sticky;top:0;z-index:30;background:rgba(247,245,242,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:14px 22px}
  .sname{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;font-size:1.4rem}
  .sname .mk{width:30px;height:30px}
  .shead .right{display:flex;align-items:center;gap:10px}
  .lnk{font-size:.9rem;color:var(--stone);font-weight:600}
  .lnk:hover{color:var(--ink)}
  .cartbtn{position:relative;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-weight:600;display:flex;align-items:center;gap:8px}
  .cartbtn svg{width:17px;height:17px}
  .cartbtn .count{background:var(--gold);color:#fff;border-radius:999px;min-width:19px;height:19px;font-size:11px;display:grid;place-items:center;padding:0 5px}

  .wrapc{max-width:1040px;margin:0 auto;padding:0 22px}

  /* ---- store blocks (match builder output) ---- */
  .b-hero{padding:72px 40px;text-align:center}
  .b-hero[data-align=left]{text-align:left}
  .b-hero[data-align=left] p{margin:0}
  .b-hero h1{font-family:var(--serif);font-size:clamp(2.2rem,5vw,3.4rem);font-weight:600;margin:0 0 14px;line-height:1.05}
  .b-hero p{color:var(--stone);max-width:48ch;margin:0 auto;font-size:1.08rem}
  .b-btn{display:inline-block;margin-top:22px;background:var(--gold);color:#fff;font-weight:600;padding:13px 26px;border-radius:999px;border:0;font-size:.95rem;transition:background .2s,transform .15s}
  .b-btn:hover{background:var(--gold-deep);transform:translateY(-2px)}
  .b-hero{background:linear-gradient(130deg,var(--gold-tint),#fff)}
  .sec{padding:56px 0}
  .sec h2{font-family:var(--serif);font-size:clamp(1.7rem,3.5vw,2.3rem);font-weight:600;margin:0 0 26px}
  .pg{display:grid;gap:18px}
  .pg.c2{grid-template-columns:repeat(2,1fr)}.pg.c3{grid-template-columns:repeat(3,1fr)}.pg.c4{grid-template-columns:repeat(4,1fr)}
  .pc{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;transition:transform .18s,box-shadow .18s;display:flex;flex-direction:column}
  .pc:hover{transform:translateY(-4px);box-shadow:0 16px 32px -18px rgba(28,25,23,.3)}
  .pc .pci{aspect-ratio:1/1;display:grid;place-items:center;background:#f2f0ed}
  .pc .pci img{width:100%;height:100%;object-fit:cover}
  .pc .pcb{padding:14px;display:flex;flex-direction:column;flex:1}
  .pc .pcn{font-weight:600;font-size:.95rem}
  .pc .pcd{color:var(--muted);font-size:.8rem;margin-top:2px}
  .pc .pcp{color:var(--gold-deep);font-weight:800;margin-top:8px;font-size:1rem}
  .pc .add{margin-top:12px;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:10px;font-weight:600;font-size:.86rem;transition:background .2s}
  .pc .add:hover{background:#2a2521}
  .pc .add:disabled{background:#cfc8bf;cursor:not-allowed}
  .b-banner{padding:36px 40px;display:flex;align-items:center;gap:22px;background:linear-gradient(130deg,var(--ink),var(--gold-deep));color:#fff;border-radius:16px}
  .b-banner .be{width:94px;height:94px;border-radius:11px;overflow:hidden;flex:none}
  .banner-image{width:100%;height:100%;object-fit:cover}
  .b-banner h3{font-family:var(--serif);font-size:1.8rem;font-weight:600;margin:0}
  .b-banner p{color:rgba(255,255,255,.82);margin:4px 0 0;font-size:.95rem}
  .b-banner .b-btn{margin:0 0 0 auto;background:var(--gold-light);color:var(--ink);white-space:nowrap}
  .cr{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .cc{aspect-ratio:3/4;border-radius:14px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;color:#fff;position:relative;overflow:hidden}
  .cc .ccb{position:absolute;inset:0;background-size:cover;background-position:center}
  .cc span{position:relative;z-index:1;font-size:32px}.cc b{position:relative;z-index:1;font-family:var(--serif);font-weight:600;font-size:1.2rem;margin-top:6px}
  .b-rich{max-width:68ch}
  .b-rich p{color:var(--stone);font-size:1.05rem;line-height:1.75}
  .b-quote{text-align:center;padding:20px 0}
  .b-quote blockquote{font-family:var(--serif);font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:500;line-height:1.3;margin:0 auto;max-width:34ch}
  .b-quote .who{color:var(--stone);margin-top:16px;font-size:.92rem}
  .b-news{text-align:center;background:var(--gold-tint);border-radius:16px;padding:48px 30px}
  .b-news h3{font-family:var(--serif);font-size:2rem;font-weight:600;margin:0 0 18px}
  .b-news .nf{display:flex;gap:8px;max-width:440px;margin:0 auto}
  .b-news input{flex:1;border:1px solid var(--line);border-radius:999px;padding:13px 18px;background:#fff;min-width:0}

  /* cart drawer */
  .ov{position:fixed;inset:0;background:rgba(28,25,23,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
  .ov.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:#fff;z-index:60;box-shadow:-20px 0 60px -24px rgba(28,25,23,.5);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s}
  .drawer.open{transform:none}
  .dh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
  .dh h3{font-family:var(--serif);margin:0;font-size:1.3rem;font-weight:600}
  .x{width:34px;height:34px;border:0;background:transparent;color:var(--stone);border-radius:9px;display:grid;place-items:center}
  .x:hover{background:#f0ece6}.x svg{width:18px;height:18px}
  .ditems{flex:1;overflow-y:auto;padding:12px 20px}
  .ci{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #f0ece6}
  .ci .cimg{width:58px;height:58px;border-radius:10px;background:var(--gold-tint);display:grid;place-items:center;overflow:hidden;flex:none}
  .ci .cit{font-weight:600;font-size:.9rem}.ci .cip{color:var(--gold-deep);font-weight:700;font-size:.85rem;margin-top:2px}
  .qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;margin-top:8px}
  .qty button{width:28px;height:28px;border:0;background:#fff;font-size:15px}
  .qty span{min-width:28px;text-align:center;font-size:13px;font-weight:600}
  .df{border-top:1px solid var(--line);padding:18px 20px}
  .dl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px;color:var(--stone)}
  .dt{display:flex;justify-content:space-between;font-size:17px;font-weight:800;margin:10px 0 14px}
  .wfull{width:100%;justify-content:center;display:flex}
  .empty{text-align:center;color:var(--muted);padding:50px 20px}.empty .bi{font-size:34px;margin-bottom:10px}

  /* checkout */
  .cowrap{max-width:860px;margin:0 auto;padding:34px 22px}
  .coback{font-size:.9rem;color:var(--stone);font-weight:600;margin-bottom:16px;display:inline-flex;gap:6px;background:none;border:0;padding:0}
  .coh{font-family:var(--serif);font-size:2rem;font-weight:600;margin:0 0 22px}
  .cogrid{display:grid;grid-template-columns:1.3fr .9fr;gap:26px}
  .cocard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px}
  .cocard h4{margin:0 0 14px;font-size:1rem}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:.78rem;font-weight:600;color:var(--stone);margin-bottom:5px}
  .field input,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fff;font-size:.92rem}
  .field input:focus,.field select:focus{outline:none;border-color:var(--gold)}
  .field.err input,.field.err select{border-color:#dc2626}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .opt{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:11px;padding:13px 15px;margin-bottom:9px;cursor:pointer}
  .opt.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-tint);background:var(--gold-tint)}
  .opt .pr{margin-left:auto;font-weight:700}
  .opt .tag{margin-left:auto;font-size:.78rem;color:var(--muted)}
  .cosum{background:#faf8f4;border:1px solid var(--line);border-radius:14px;padding:20px;position:sticky;top:90px;height:fit-content}
  .si{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #f0ece6;font-size:.9rem}
  .si .cimg{width:42px;height:42px;border-radius:9px;background:var(--gold-tint);display:grid;place-items:center;overflow:hidden;font-size:21px;position:relative;flex:none}
  .cimg img{width:100%;height:100%;object-fit:cover}
  .si .qb{position:absolute;top:-6px;right:-6px;background:var(--ink);color:#fff;border-radius:999px;width:19px;height:19px;font-size:11px;display:grid;place-items:center}
  .consent{display:flex;gap:9px;align-items:flex-start;font-size:.78rem;color:var(--stone);margin:14px 0}
  .note{font-size:.76rem;color:var(--muted);text-align:center;margin-top:10px}

  .payov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
  .payov.open{opacity:1;pointer-events:auto}
  .paybox{background:#fff;border-radius:18px;padding:36px 42px;text-align:center;max-width:360px}
  .paybox .pf{font-weight:800;color:#e4572e;font-size:20px;margin-bottom:14px}
  .spin{width:40px;height:40px;border:3px solid #eee;border-top-color:var(--gold);border-radius:50%;margin:0 auto 16px;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .confirm{max-width:560px;margin:50px auto;padding:0 22px;text-align:center}
  .confirm .tick{width:74px;height:74px;border-radius:50%;background:var(--gold);display:grid;place-items:center;margin:0 auto 18px}
  .confirm .tick svg{width:38px;height:38px;color:#fff}
  .confirm h1{font-family:var(--serif);font-size:2rem;font-weight:600;margin:0 0 8px}

  .foot{border-top:1px solid var(--line);padding:34px 22px;text-align:center;color:var(--muted);font-size:.85rem;margin-top:40px}

  @media (max-width:820px){.cogrid{grid-template-columns:1fr}.cosum{position:static}}
  @media (max-width:640px){.pg.c3,.pg.c4{grid-template-columns:1fr 1fr}.cr{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.b-banner{flex-direction:column;text-align:center}.b-banner .b-btn{margin:10px 0 0}}
  @media (max-width:420px){.pg.c2,.pg.c3,.pg.c4{grid-template-columns:1fr}}
  @media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important;animation-duration:.001ms!important}}

  /* announcement marquee */
  .announce{background:var(--ink);color:#f3ece2;overflow:hidden;border-bottom:1px solid #2a241f}
  .announce .mq{display:flex;gap:44px;width:max-content;padding:9px 0;animation:amq 28s linear infinite;font-size:.82rem;font-weight:600}
  .announce .mq span{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .announce .mq b{color:var(--gold-light)}
  @keyframes amq{to{transform:translateX(-50%)}}
  @media (prefers-reduced-motion:reduce){.announce .mq{animation:none;flex-wrap:wrap;width:auto;justify-content:center;gap:16px}}

  /* product card polish */
  .pc .pci{overflow:hidden;position:relative}
  .pci-photo{display:block;width:100%;height:100%;object-fit:cover;transition:transform .45s ease}
  .pc:hover .pci-photo{transform:scale(1.06)}
  .pc .quick{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:var(--ink);box-shadow:0 8px 20px -8px rgba(28,25,23,.5);display:grid;place-items:center;font-size:22px;line-height:1;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s,background .2s}
  .pc:hover .quick{opacity:1;transform:none}
  .pc .quick:hover{background:var(--gold);color:#fff}
  .pc .quick[disabled]{display:none}
  .ribbon{position:absolute;top:10px;left:10px;z-index:2;background:var(--ink);color:#fff;font-size:.66rem;font-weight:700;padding:4px 9px;border-radius:999px;letter-spacing:.02em}
  .ribbon.low{background:#b42318}

  /* benefits strip */
  .benefits{background:#faf6ef;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .benefits .row{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:32px 22px}
  .benefit{display:flex;gap:12px;align-items:flex-start}
  .benefit .bi{width:42px;height:42px;border-radius:12px;background:var(--gold-tint);color:var(--gold-deep);display:grid;place-items:center;flex:none}
  .benefit .bi svg{width:20px;height:20px}
  .benefit h4{margin:0;font-size:.92rem;font-weight:700}
  .benefit p{margin:2px 0 0;font-size:.8rem;color:var(--muted)}
  @media(max-width:760px){.benefits .row{grid-template-columns:1fr 1fr}}
  @media(max-width:420px){.benefits .row{grid-template-columns:1fr}}

  /* richer footer */
  .sfoot{background:var(--ink);color:#c9bfb2;padding:48px 22px 30px;margin-top:0}
  .sfoot .cols{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:30px}
  .sfoot h5{color:#fff;font-family:var(--serif);font-size:1.4rem;font-weight:600;margin:0 0 8px}
  .sfoot .cols>div>p{font-size:.86rem;max-width:34ch;margin:0;color:#b4a99b}
  .sfoot h6{color:#fff;font-size:.74rem;letter-spacing:.06em;margin:0 0 10px;text-transform:uppercase}
  .sfoot a{display:block;color:#c9bfb2;font-size:.86rem;padding:4px 0;text-decoration:none}
  .sfoot a:hover{color:var(--gold-light)}
  .sfoot .bottom{max-width:1040px;margin:26px auto 0;padding-top:18px;border-top:1px solid #2a241f;font-size:.8rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  @media(max-width:640px){.sfoot .cols{grid-template-columns:1fr}}

  /* ---- real pages: product detail, cart ---- */
  .crumb{max-width:1040px;margin:0 auto;padding:20px 22px 0;font-size:.84rem;color:var(--muted)}
  .crumb a{color:var(--stone);font-weight:600}
  .crumb a:hover{color:var(--gold-deep)}
  .pdp{max-width:1040px;margin:0 auto;padding:18px 22px 60px;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:start}
  .pdp-gal{position:sticky;top:90px}
  .pdp-main{border-radius:16px;overflow:hidden;background:var(--gold-tint);aspect-ratio:1/1;border:1px solid var(--line)}
  .pdp-main img{width:100%;height:100%;object-fit:cover;display:block}
  .pdp-thumbs{display:flex;gap:10px;margin-top:12px}
  .pdp-thumbs button{width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--gold-tint);padding:0}
  .pdp-thumbs button.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-tint)}
  .pdp-thumbs img{width:100%;height:100%;object-fit:cover;display:block}
  .pdp h1{font-family:var(--serif);font-size:clamp(2rem,4vw,2.8rem);font-weight:600;margin:6px 0 10px;line-height:1.08}
  .pdp .cat{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--gold-deep);font-weight:700}
  .pdp .price{font-size:1.7rem;font-weight:800;color:var(--gold-deep);font-variant-numeric:tabular-nums}
  .pdp .vat{font-size:.8rem;color:var(--muted);margin-top:2px}
  .pdp .desc{color:var(--stone);margin:18px 0;line-height:1.7}
  .pdp .stock{display:inline-flex;align-items:center;gap:7px;font-size:.84rem;font-weight:600;border-radius:999px;padding:6px 13px;background:#eaf5ef;color:#1d6b4f}
  .pdp .stock.out{background:#fdeceb;color:#b42318}
  .pdp .stock.low{background:var(--gold-tint);color:var(--gold-deep)}
  .pdp-buy{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
  .qstep{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .qstep button{width:40px;height:46px;border:0;background:#fff;font-size:17px;color:var(--ink)}
  .qstep button:hover{background:var(--gold-tint)}
  .qstep span{min-width:44px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
  .pdp-specs{margin-top:26px;border-top:1px solid var(--line);padding-top:18px}
  .pdp-specs .row{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line-2,#f0ece6);font-size:.88rem}
  .pdp-specs .row span:first-child{color:var(--muted)}
  .related{max-width:1040px;margin:0 auto;padding:0 22px 70px}
  .related h2{font-family:var(--serif);font-size:1.7rem;font-weight:600;margin:0 0 20px}
  .cartpage{max-width:1040px;margin:0 auto;padding:18px 22px 70px}
  .cartpage h1{font-family:var(--serif);font-size:2.4rem;font-weight:600;margin:6px 0 24px}
  .cart-grid{display:grid;grid-template-columns:1.5fr .8fr;gap:34px;align-items:start}
  .cart-line{display:flex;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
  .cart-line .im{width:92px;height:92px;border-radius:12px;overflow:hidden;background:var(--gold-tint);flex:none;border:1px solid var(--line)}
  .cart-line .im img{width:100%;height:100%;object-fit:cover;display:block}
  .cart-line .nm{font-weight:600}
  .cart-line .nm a:hover{color:var(--gold-deep)}
  .cart-line .rm{background:none;border:0;color:var(--muted);font-size:.8rem;text-decoration:underline;padding:0;margin-top:6px}
  .cart-line .rm:hover{color:#b42318}
  .cart-empty{text-align:center;padding:70px 20px;color:var(--muted)}
  .cart-empty .bi{font-size:40px;margin-bottom:10px}
  .cart-sum{border:1px solid var(--line);border-radius:14px;padding:20px;background:#fff;position:sticky;top:90px}
  .wfull{width:100%}
  @media(max-width:860px){.pdp,.cart-grid{grid-template-columns:1fr;gap:26px}.pdp-gal,.cart-sum{position:static}}
</style>
</head>
<body>
<div class="pbar">You're viewing a live <b>MiraiStitch</b> store (demo). <a href="app.html">Go to admin →</a></div>
<div id="root"></div>

<div class="payov" id="payov"><div class="paybox"><div class="pf">PayFast</div><div class="spin"></div><div style="font-weight:600">Redirecting to secure payment…</div><div style="color:#999;font-size:12px;margin-top:6px">Sandbox demo — no real charge</div></div></div>

<script>
(function(){
  "use strict";

  // ---- shared state (seed if admin never opened) ----
  var DEFAULT_STATE={
    store:{name:"Northgate Trading",tagline:"Tech, home & everything between"},nextOrder:1002,setup:{},
    products:[
      {id:"p1",title:"27\" 4K Monitor",desc:"IPS, 60Hz, HDMI",price:429900,stock:18,img:"images/products/w/monitor-4k-640.webp",active:true},
      {id:"p2",title:"Oak Desk Chair",desc:"Ergonomic, lumbar support",price:245000,stock:12,img:"images/products/w/oak-desk-chair-640.webp",active:true},

    ],orders:[]

  var DEFAULT_LAYOUT=[
    {id:"h",type:"hero",props:{heading:"Everything you need, delivered.",sub:"Tech, furniture, home and more — shipped across South Africa.",btn:"Shop now",align:"center"}},
    {id:"p",type:"products",props:{title:"Featured products",cols:"3"}},
    {id:"c",type:"collection",props:{title:"Shop by category"}},
    {id:"t",type:"testimonial",props:{quote:"The quality is unreal and it arrived in two days.",author:"Lerato M., Johannesburg"}},
    {id:"n",type:"newsletter",props:{heading:"Join the list",btn:"Subscribe"}}
  ];
  var S=loadS(), L=loadL(), cart=loadCart();
  function loadS(){try{var r=JSON.parse(localStorage.getItem(SKEY));if(r&&r.products)return r}catch(e){}return JSON.parse(JSON.stringify(DEFAULT_STATE))}
  function loadL(){try{var r=JSON.parse(localStorage.getItem(LKEY));if(r&&r.length)return r}catch(e){}return JSON.parse(JSON.stringify(DEFAULT_LAYOUT))}
  function loadCart(){try{var r=JSON.parse(localStorage.getItem(CKEY));if(r)return r}catch(e){}return[]}
  function saveS(){try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}}
  function saveCart(){try{localStorage.setItem(CKEY,JSON.stringify(cart))}catch(e){}}

  // ---- block renderer ----
  function block(b){
    var p=b.props;
    if(b.type==="hero")return '<section class="b-hero" data-align="'+(p.align||"center")+'"><div class="wrapc"><h1>'+esc(p.heading)+'</h1><p>'+esc(p.sub)+'</p><div><button class="b-btn" data-scroll-products>'+esc(p.btn)+'</button></div></div></section>';
    if(b.type==="products"){var items=activeProducts().slice(0,p.cols==="2"?4:p.cols==="4"?8:6);
      return '<section class="sec" id="products"><div class="wrapc"><h2>'+esc(p.title)+'</h2><div class="pg c'+(p.cols||"3")+'">'+items.map(function(x){
        var ribbon=x.stock<=0?'<span class="ribbon low">Sold out</span>':(x.stock<=10?'<span class="ribbon low">Only '+x.stock+' left</span>':'');
        return '<div class="pc" data-pid="'+x.id+'"><div class="pci">'+ribbon+photo(x,'pci-photo')+'<button class="quick" data-add="'+x.id+'" aria-label="Quick add"'+(x.stock<=0?' disabled':'')+'>+</button></div><div class="pcb"><div class="pcn">'+esc(x.title)+'</div><div class="pcd">'+esc(x.desc||"")+'</div><div class="pcp money">'+R(x.price)+'</div><button class="add" data-add="'+x.id+'"'+(x.stock<=0?' disabled':'')+'>'+(x.stock<=0?'Sold out':'Add to cart')+'</button></div></div>';
      }).join("")+'</div></div></section>';}
    if(b.type==="richtext")return '<section class="sec"><div class="wrapc"><div class="b-rich"><h2 style="font-family:var(--serif);font-size:1.9rem;font-weight:600;margin:0 0 14px">'+esc(p.heading)+'</h2><p>'+esc(p.body)+'</p></div></div></section>';
    if(b.type==="banner")return '<section class="sec"><div class="wrapc"><div class="b-banner"><div class="be">'+photo({title:"Wireless Earbuds"},'banner-image')+'</div><div><h3>'+esc(p.heading)+'</h3><p>'+esc(p.sub)+'</p></div><button class="b-btn" data-scroll-products>'+esc(p.btn)+'</button></div></div></section>';
    if(b.type==="collection"){var cats=[["Electronics","27\" 4K Monitor"],["Furniture","Modular Sofa"],["Fashion & apparel","Contemporary Apparel"],["Beauty & wellness","Skincare Collection"],["Groceries","Grocery Essentials"],["Sport & outdoor","Outdoor Pack"],["Home textiles","Cotton Towel Set"],["Tools & hardware","Cordless Drill 18V"]];
      return '<section class="sec"><div class="wrapc"><h2>'+esc(p.title)+'</h2><div class="cr">'+cats.map(function(c){return '<div class="cc"><div class="ccb" style="background-image:linear-gradient(0deg,rgba(26,23,20,.75),rgba(26,23,20,.05)),url('+PRODUCT_PHOTOS[c[1]]+')"></div><b>'+c[0]+'</b></div>'}).join("")+'</div></div></section>';}

    if(b.type==="newsletter")return '<section class="sec"><div class="wrapc"><div class="b-news"><h3>'+esc(p.heading)+'</h3><div class="nf"><input placeholder="you@example.co.za" aria-label="Email"><button class="b-btn" data-news>'+esc(p.btn)+'</button></div></div></div></section>';
    if(b.type==="spacer")return '<div style="height:'+(p.h||48)+'px"></div>';

  // ---- shells ----
  function headerHtml(){
    return '<header class="shead"><a class="sname" href="#top"><svg class="mk" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#1c1917"/><path d="M7 20 L13 11 L16 16 L19 11 L25 20" fill="none" stroke="#d9a94e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 2.4"/></svg>'+esc(S.store.name)+'</a>'+
      '<div class="right"><a class="lnk" href="builder.html">Edit design</a><button class="cartbtn" data-cart>'+svg('<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 002 1.6h9.7a2 2 0 002-1.6L23 6H6"/>')+'Cart'+(cartCount()?'<span class="count">'+cartCount()+'</span>':'')+'</button></div></header>';
  }
  function render(){
    var h='<div id="top">'+headerHtml();
    if(view==="store")h+=announce()+L.map(block).join("")+benefits()+footer();
    else if(view==="product")h+=productPage()+footer();
    else if(view==="cart")h+=cartPage()+footer();
    else if(view==="checkout")h+=checkout();
    else if(view==="confirm")h+=confirm();
    h+='</div>';
    h+=drawer();
    root.innerHTML=h;
    if(view==="store")storeMotion();
  }
  function announce(){
    var msgs=['🚚 Free delivery on orders over <b>R500</b>','💳 Pay with <b>PayFast</b>, Yoco, Ozow or SnapScan','📦 Nationwide <b>Pudo</b> &amp; Courier Guy delivery','🇿🇦 Proudly South Africa'];
    var row=msgs.map(function(m){return '<span>'+m+'</span>'}).join('');
    return '<div class="announce"><div class="mq">'+row+row+'</div></div>';
  }
  function benefits(){
    var b=[
      ['<path d="M3 7h11v8H3zM14 10h4l3 3v2h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17.5" cy="18" r="1.6"/>','Nationwide delivery','Pudo, Courier Guy & PAXI'],
      ['<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>','Secure checkout','PayFast, Yoco, Ozow & SnapScan'],
      ['<path d="M3 12a9 9 0 109-9M3 7v5h5"/>','Easy returns','14-day hassle-free returns'],

  function footer(){
    return '<footer class="sfoot"><div class="cols">'+
      '<div><h5>'+esc(S.store.name)+'</h5><p>'+esc(S.store.tagline||'')+' — proudly South African, delivered to your door.</p></div>'+
      '<div><h6>Shop</h6><a href="#products">All products</a><a href="#">New in</a><a href="#">Gift cards</a></div>'+
      '<div><h6>Help</h6><a href="#">Shipping &amp; returns</a><a href="#">Track order</a><a href="app.html">Store admin</a><a href="builder.html">Edit this store</a></div>'+
      '</div><div class="bottom"><span>© '+new Date().getFullYear()+' '+esc(S.store.name)+' · Powered by MiraiStitch</span><span>Secure PayFast checkout · incl. 15% VAT</span></div></footer>';
  }
  function storeMotion(){
    if(!G||motionDone)return; motionDone=true;
    G.utils.toArray(".b-hero, .sec").forEach(function(el){G.from(el,{opacity:0,y:28,duration:.6,ease:"power2.out",scrollTrigger:{trigger:el,start:"top 86%",once:true}})});
    if($("#products"))G.from(".pc",{opacity:0,y:24,duration:.5,stagger:.06,ease:"power2.out",scrollTrigger:{trigger:"#products",start:"top 82%",once:true}});
    if($(".benefits"))G.from(".benefit",{opacity:0,y:18,duration:.5,stagger:.08,ease:"power2.out",scrollTrigger:{trigger:".benefits",start:"top 90%",once:true}});
  }

  function drawer(){
    var h='<div class="ov'+(cartOpen?' open':'')+'" data-closecart></div><aside class="drawer'+(cartOpen?' open':'')+'"><div class="dh"><h3>Your cart</h3><button class="x" data-closecart>'+svg('<path d="M6 6l12 12M18 6 6 18"/>')+'</button></div>';
    if(!cart.length){h+='<div class="ditems"><div class="empty"><div class="bi">🛒</div>Your cart is empty.</div></div></aside>';return h}
    h+='<div class="ditems">';
    cart.forEach(function(c){var p=prod(c.id);if(!p)return;
      h+='<div class="ci"><div class="cimg">'+photo(p)+'</div><div style="flex:1"><div class="cit">'+esc(p.title)+'</div><div class="cip money">'+R(p.price)+'</div><div class="qty"><button data-q="-1" data-id="'+c.id+'">−</button><span>'+c.qty+'</span><button data-q="1" data-id="'+c.id+'">+</button></div></div><div class="money" style="font-weight:700">'+R(p.price*c.qty)+'</div></div>';
    });
    h+='</div><div class="df"><div class="dl"><span>Subtotal (incl. VAT)</span><span class="money">'+R(cartSub())+'</span></div><div class="dl" style="color:var(--muted)">Shipping at checkout</div><button class="b-btn wfull" style="margin-top:8px" data-checkout>Checkout · '+R(cartSub())+'</button></div></aside>';
    return h;
  }

  function checkout(){
    var sub=cartSub(), total=sub+ship.price, vat=Math.round(total*VAT/(1+VAT));
    var ships=[["The Courier Guy",9900,"2–3 days, to your door"],["Pudo Locker",6000,"Collect from a locker"],["Local pickup",0,"Collect in-store, free"]];
    var pays=[["PayFast","Cards, Instant EFT & more"],["Yoco","Card payment"],["Ozow","Instant EFT"],["SnapScan","Scan to pay"]];

    h+='<div class="cocard"><h4>Contact & delivery</h4><div class="two"><div class="field"><label>First name</label><input name="fn" required></div><div class="field"><label>Last name</label><input name="ln" required></div></div><div class="field"><label>Email</label><input name="em" type="email" required placeholder="you@example.co.za"></div><div class="field"><label>Phone</label><input name="ph" required placeholder="082 000 0000"></div><div class="field"><label>Delivery address</label><input name="ad" required placeholder="Street, suburb, city, code"></div></div>';
    h+='<div class="cocard"><h4>Shipping</h4>'+ships.map(function(s){return '<label class="opt'+(ship.name===s[0]?' sel':'')+'" data-ship="'+s[0]+'" data-price="'+s[1]+'"><input type="radio" name="sh" '+(ship.name===s[0]?'checked':'')+'><div><div style="font-weight:600">'+s[0]+'</div><div style="font-size:.78rem;color:var(--muted)">'+s[2]+'</div></div><div class="pr money">'+(s[1]?R(s[1]):"Free")+'</div></label>'}).join("")+'</div>';
    h+='<div class="cocard"><h4>Payment</h4>'+pays.map(function(x){return '<label class="opt'+(pay===x[0]?' sel':'')+'" data-pay="'+x[0]+'"><input type="radio" name="pm" '+(pay===x[0]?'checked':'')+'><span style="font-weight:700">'+x[0]+'</span><span class="tag">'+x[1]+'</span></label>'}).join("")+'</div></div>';
    h+='<div class="cosum"><div style="font-weight:700;margin-bottom:10px">Order summary</div>';
    cart.forEach(function(c){var p=prod(c.id);if(!p)return;h+='<div class="si"><div class="cimg">'+photo(p)+'<span class="qb">'+c.qty+'</span></div><div style="flex:1">'+esc(p.title)+'</div><div class="money">'+R(p.price*c.qty)+'</div></div>'});
    h+='<div style="margin-top:12px"><div class="dl"><span>Subtotal</span><span class="money">'+R(sub)+'</span></div><div class="dl"><span>Shipping</span><span class="money">'+(ship.price?R(ship.price):"Free")+'</span></div><div class="dl"><span>of which VAT (15%)</span><span class="money">'+R(vat)+'</span></div><div class="dt"><span>Total</span><span class="money">'+R(total)+'</span></div></div>';
    h+='<label class="consent"><input type="checkbox" name="popia" required> I agree to the processing of my information for this order (POPIA).</label>';
    h+='<button class="b-btn wfull" data-place type="submit">Pay '+R(total)+' with '+pay+'</button><div class="note">🔒 Demo checkout — no real payment is taken.</div></div></div></form></div>';
    return h;
  }

  function confirm(){
    var o=lastOrder;if(!o)return '<div class="confirm">Order placed.</div>';
    var h='<div class="confirm"><div class="tick">'+svg('<path d="M20 6 9 17l-5-5"/>')+'</div><h1>Thank you, '+esc(o.name.split(" ")[0])+'!</h1><p style="color:var(--stone)">Order '+o.num+' is confirmed — a receipt is on its way to '+esc(o.email)+'.</p>';
    h+='<div class="cocard" style="text-align:left;margin:22px 0">';
    o.items.forEach(function(i){h+='<div class="si"><div class="cimg">'+photo(i)+'<span class="qb">'+i.qty+'</span></div><div style="flex:1">'+esc(i.title)+'</div><div class="money">'+R(i.price*i.qty)+'</div></div>'});
    h+='<div class="dt" style="margin-top:12px"><span>Total paid</span><span class="money">'+R(o.items.reduce(function(a,i){return a+i.price*i.qty},0)+o.ship)+'</span></div><div class="note" style="text-align:left">'+esc(o.shipName)+' · Paid via '+esc(o.pay)+'</div></div>';
    h+='<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="cartbtn" data-back>Continue shopping</button><a class="b-btn" href="app.html">See it in admin →</a></div></div>';
    return h;
  }

  // ---- routing ----
  // Every page is a real URL, so the back button, refresh and deep links all work
  // the way a shopper expects. Hash routing because this is a static file with no
  // server to rewrite paths.
  var routeId=null, pdpQty=1;
  function go(h){ if(location.hash===h) route(); else location.hash=h; }
  function route(){
    var h=(location.hash||"#/").replace(/^#/,"");
    var m=h.match(/^\/product\/(.+)$/);
    if(m && prod(decodeURIComponent(m[1]))){ view="product"; routeId=decodeURIComponent(m[1]); pdpQty=1; }
    else if(h==="/cart") view="cart";
    else if(h==="/checkout") view=cart.length?"checkout":"cart";
    else if(h==="/done") view=lastOrder?"confirm":"store";
    else { view="store"; routeId=null; }
    cartOpen=false;
    render(); scrollTop();
  }
  addEventListener("hashchange",route);

  function stockPill(p){
    if(p.stock<=0) return '<span class="stock out">Sold out</span>';
    if(p.stock<=10) return '<span class="stock low">Only '+p.stock+' left</span>';
    return '<span class="stock">In stock · ships in 1–2 days</span>';
  }

  function productPage(){
    var p=prod(routeId); if(!p) return '<div class="cart-empty">Product not found. <a href="#/">Back to the store</a></div>';
    var vat=Math.round(p.price*VAT/(1+VAT));
    var others=activeProducts().filter(function(x){return x.id!==p.id}).slice(0,3);
    var h='<nav class="crumb"><a href="#/">Store</a> · '+esc(p.title)+'</nav>';
    h+='<div class="pdp"><div class="pdp-gal"><div class="pdp-main">'+photo(p)+'</div>'
     + '<div class="pdp-thumbs">'+[p].concat(others.slice(0,2)).map(function(x,i){
         return '<button class="'+(i===0?'on':'')+'" aria-label="'+esc(x.title)+'"'+(i?' data-goto="#/product/'+encodeURIComponent(x.id)+'"':'')+'>'+photo(x)+'</button>';
       }).join('')+'</div></div>';
    h+='<div><div class="cat">'+esc((p.desc||"Product").split(",")[0])+'</div><h1>'+esc(p.title)+'</h1>'
     + '<div class="price money">'+R(p.price)+'</div><div class="vat">Incl. VAT '+R(vat)+' · free delivery over R500</div>'
     + '<div style="margin-top:14px">'+stockPill(p)+'</div>'
     + '<p class="desc">'+esc(p.desc||"")+'. Sold and delivered by '+esc(S.store.name)+', with nationwide shipping via Pudo, The Courier Guy and PAXI. 14-day returns.</p>'
     + '<div class="pdp-buy"><div class="qstep"><button data-pq="-1" aria-label="Decrease">−</button><span>'+pdpQty+'</span><button data-pq="1" aria-label="Increase">+</button></div>'
     + '<button class="b-btn" data-addq="'+p.id+'"'+(p.stock<=0?' disabled':'')+'>'+(p.stock<=0?'Sold out':'Add to cart')+'</button>'
     + '<button class="cartbtn" data-buynow="'+p.id+'"'+(p.stock<=0?' disabled':'')+'>Buy it now</button></div>'
     + '<div class="pdp-specs">'
     + '<div class="row"><span>Delivery</span><span>Pudo · Courier Guy · PAXI</span></div>'
     + '<div class="row"><span>Payment</span><span>PayFast, Yoco, Ozow, SnapScan</span></div>'
     + '<div class="row"><span>Returns</span><span>14 days, free</span></div>'
     + '<div class="row"><span>SKU</span><span>'+esc(String(p.id).toUpperCase())+'</span></div></div></div></div>';
    if(others.length){
      h+='<div class="related"><h2>You might also like</h2><div class="pg c3">'+others.map(function(x){
        return '<div class="pc" data-goto="#/product/'+encodeURIComponent(x.id)+'"><div class="pci">'+photo(x,'pci-photo')+'</div>'
             + '<div class="pcb"><div class="pcn">'+esc(x.title)+'</div><div class="pcp money">'+R(x.price)+'</div></div></div>';
      }).join('')+'</div></div>';
    }
    return h;
  }

  function cartPage(){
    if(!cart.length) return '<div class="cartpage"><h1>Your cart</h1><div class="cart-empty"><div class="bi">🛒</div><p>Your cart is empty.</p><a class="b-btn" href="#/">Start shopping</a></div></div>';
    var h='<div class="cartpage"><nav class="crumb" style="padding-left:0"><a href="#/">Store</a> · Cart</nav><h1>Your cart</h1><div class="cart-grid"><div>';
    cart.forEach(function(c){ var p=prod(c.id); if(!p) return;
      h+='<div class="cart-line"><div class="im">'+photo(p)+'</div>'
       + '<div style="flex:1"><div class="nm"><a href="#/product/'+encodeURIComponent(p.id)+'">'+esc(p.title)+'</a></div>'
       + '<div class="money" style="color:var(--gold-deep);font-weight:700;margin-top:3px">'+R(p.price)+'</div>'
       + '<button class="rm" data-rm="'+p.id+'">Remove</button></div>'
       + '<div class="qstep"><button data-q="-1" data-id="'+p.id+'">−</button><span>'+c.qty+'</span><button data-q="1" data-id="'+p.id+'">+</button></div>'
       + '<div class="money" style="font-weight:800;min-width:92px;text-align:right">'+R(p.price*c.qty)+'</div></div>';
    });
    h+='<p style="margin-top:20px"><a href="#/" style="color:var(--stone);font-weight:600">← Continue shopping</a></p></div>';
    h+='<aside class="cart-sum"><div style="font-weight:700;margin-bottom:12px">Order summary</div>'
     + '<div class="dl"><span>Subtotal (incl. VAT)</span><span class="money">'+R(cartSub())+'</span></div>'
     + '<div class="dl" style="color:var(--muted)"><span>Delivery</span><span>Calculated at checkout</span></div>'
     + '<button class="b-btn wfull" style="margin-top:14px" data-goto="#/checkout">Checkout · '+R(cartSub())+'</button>'
     + '<div class="note" style="margin-top:10px">🔒 Demo store — no real payment is taken.</div></aside></div></div>';
    return h;
  }

  // ---- events ----
  document.addEventListener("click",function(e){
    var t=e.target;
    // generic navigation: anything with data-goto moves to that route
    var nav=t.closest("[data-goto]"); if(nav){ go(nav.getAttribute("data-goto")); return }
    // a product card opens its own page; the quick-add button inside it does not
    var card=t.closest(".pc"); if(card && !t.closest("[data-add]") && card.getAttribute("data-pid")){
      go("#/product/"+encodeURIComponent(card.getAttribute("data-pid"))); return }
    var pq=t.closest("[data-pq]"); if(pq){ pdpQty=Math.max(1,pdpQty+(+pq.getAttribute("data-pq"))); render(); return }
    var aq=t.closest("[data-addq]"); if(aq){ addToCart(aq.getAttribute("data-addq"),pdpQty); go("#/cart"); return }
    var bn=t.closest("[data-buynow]"); if(bn){ addToCart(bn.getAttribute("data-buynow"),pdpQty); go("#/checkout"); return }
    var rm=t.closest("[data-rm]"); if(rm){ cart=cart.filter(function(x){return x.id!==rm.getAttribute("data-rm")}); saveCart(); render(); return }
    var add=t.closest("[data-add]"); if(add){e.preventDefault();addToCart(add.getAttribute("data-add"));cartOpen=true;render();if(G){var cc=$(".cartbtn .count");if(cc)G.fromTo(cc,{scale:0},{scale:1,duration:.4,ease:"back.out(2.5)"})}return}
    if(t.closest("[data-cart]")){go("#/cart");return}
    if(t.closest("[data-closecart]")&&(t.hasAttribute("data-closecart")||t.closest("button[data-closecart]"))){cartOpen=false;render();return}
    var q=t.closest("[data-q]"); if(q){changeQty(q.getAttribute("data-id"),+q.getAttribute("data-q"));render();return}
    if(t.closest("[data-checkout]")){if(!cart.length)return;go("#/checkout");return}
    if(t.closest("[data-back]")){go("#/");return}
    var sh=t.closest("[data-ship]"); if(sh){ship={name:sh.getAttribute("data-ship"),price:+sh.getAttribute("data-price")};render();return}
    var pm=t.closest("[data-pay]"); if(pm){pay=pm.getAttribute("data-pay");render();return}
    if(t.closest("[data-scroll-products]")){var el=$("#products");if(el)el.scrollIntoView({behavior:"smooth"});return}
    if(t.closest("[data-news]")){var inp=t.closest(".nf").querySelector("input");if(inp&&inp.value){inp.value="";t.closest("[data-news]").textContent="Subscribed ✓"}return}
  });
  document.addEventListener("submit",function(e){if(e.target.id==="cof"){e.preventDefault();place(e.target)}});

  function addToCart(id,n){var p=prod(id);if(!p||p.stock<=0)return;n=n||1;var c=cart.filter(function(x){return x.id===id})[0];if(c)c.qty+=n;else cart.push({id:id,qty:n});saveCart()}
  function changeQty(id,d){var c=cart.filter(function(x){return x.id===id})[0];if(!c)return;c.qty+=d;if(c.qty<=0)cart=cart.filter(function(x){return x.id!==id});saveCart()}

  function place(form){
    if(!form.checkValidity()){form.reportValidity();return}
    if(!cart.length)return;
    var name=(form.fn.value+" "+form.ln.value).trim(), email=form.em.value.trim();
    var ov=$("#payov");ov.classList.add("open");
    setTimeout(function(){
      ov.classList.remove("open");
      var items=cart.map(function(c){var p=prod(c.id);return {title:p.title,qty:c.qty,price:p.price,img:p.img}});
      cart.forEach(function(c){var p=prod(c.id);if(p)p.stock=Math.max(0,p.stock-c.qty)});
      var ord={id:S.nextOrder,num:"#"+S.nextOrder,name:name,email:email,date:Date.now(),status:"Paid",fulfil:"Unfulfilled",items:items,ship:ship.price,shipName:ship.name,pay:pay};
      S.nextOrder++;S.orders.unshift(ord);if(S.setup)S.setup.test=true;saveS();
      lastOrder=ord;cart=[];saveCart();
      go("#/done");
    },1600);
  }
  function scrollTop(){window.scrollTo({top:0,behavior:"instant"in window?"instant":"auto"})}

  route();
})();
</script>
</body>
</html>
